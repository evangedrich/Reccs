# Cloudflare Worker configuration
# Replace the placeholders with your actual values

name = "reccs-movies-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "reccs-media"
database_id = "322e015a-5590-4038-85ed-89150c4b104e"

# R2 Bucket Binding (optional - only needed if you want to serve images through the Worker)
# Replace YOUR_BUCKET_NAME with your actual bucket name
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "YOUR_BUCKET_NAME"

# Routes (if you want to deploy to a custom domain)
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment Variables (if needed)
# [env.production]
# [env.production.vars]
# ENVIRONMENT = "production"
